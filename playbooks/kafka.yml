---
- name: Install and configure the three-node Kafka KRaft cluster
  hosts: kafka
  become: true
  serial: 1
  vars:
    kafka_archive: "kafka_{{ kafka_scala_version }}-{{ kafka_version }}.tgz"
    kafka_home: "{{ kafka_install_root }}/kafka_{{ kafka_scala_version }}-{{ kafka_version }}"
  tasks:
    - name: Create Kafka system user
      ansible.builtin.user:
        name: kafka
        system: true
        home: "{{ kafka_data_dir }}"
        shell: /usr/sbin/nologin

    - name: Download Kafka
      ansible.builtin.get_url:
        url: "https://archive.apache.org/dist/kafka/{{ kafka_version }}/{{ kafka_archive }}"
        dest: "/tmp/{{ kafka_archive }}"
        mode: "0644"

    - name: Extract Kafka
      ansible.builtin.unarchive:
        src: "/tmp/{{ kafka_archive }}"
        dest: "{{ kafka_install_root }}"
        remote_src: true
        creates: "{{ kafka_home }}"

    - name: Create Kafka directories
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        owner: kafka
        group: kafka
        mode: "0750"
      loop:
        - "{{ kafka_data_dir }}"
        - "{{ kafka_log_dir }}"
        - /etc/kafka

    - name: Build controller quorum string
      ansible.builtin.set_fact:
        kafka_quorum: >-
          {%- for host in groups['kafka'] -%}
          {{ hostvars[host].kafka_node_id }}@{{ hostvars[host].private_ip }}:9093{{ ',' if not loop.last else '' }}
          {%- endfor -%}

    - name: Write Kafka server configuration
      ansible.builtin.copy:
        dest: /etc/kafka/server.properties
        owner: kafka
        group: kafka
        mode: "0640"
        content: |
          node.id={{ kafka_node_id }}
          process.roles=broker,controller
          controller.quorum.voters={{ kafka_quorum }}
          listeners=BROKER://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
          advertised.listeners=BROKER://{{ private_ip }}:9092
          listener.security.protocol.map=BROKER:PLAINTEXT,CONTROLLER:PLAINTEXT
          inter.broker.listener.name=BROKER
          controller.listener.names=CONTROLLER
          log.dirs={{ kafka_data_dir }}
          num.partitions={{ topic_partitions }}
          default.replication.factor={{ topic_replication_factor }}
          min.insync.replicas={{ minimum_insync_replicas }}
          offsets.topic.replication.factor=3
          transaction.state.log.replication.factor=3
          transaction.state.log.min.isr=2
          auto.create.topics.enable=false
      notify: Restart Kafka

    - name: Format Kafka storage once
      ansible.builtin.command:
        cmd: >-
          {{ kafka_home }}/bin/kafka-storage.sh format
          --cluster-id {{ kafka_cluster_id }}
          --config /etc/kafka/server.properties
        creates: "{{ kafka_data_dir }}/meta.properties"
      become_user: kafka

    - name: Install Kafka service
      ansible.builtin.copy:
        dest: /etc/systemd/system/kafka.service
        mode: "0644"
        content: |
          [Unit]
          Description=Apache Kafka KRaft broker
          After=network-online.target
          Wants=network-online.target

          [Service]
          User=kafka
          Group=kafka
          Environment=KAFKA_HEAP_OPTS=-Xms{{ kafka_heap_gb[deployment_profile] }}g -Xmx{{ kafka_heap_gb[deployment_profile] }}g
          ExecStart={{ kafka_home }}/bin/kafka-server-start.sh /etc/kafka/server.properties
          ExecStop={{ kafka_home }}/bin/kafka-server-stop.sh
          Restart=on-failure
          LimitNOFILE=100000

          [Install]
          WantedBy=multi-user.target
      notify: Restart Kafka

    - name: Flush Kafka handlers before continuing
      ansible.builtin.meta: flush_handlers

  handlers:
    - name: Restart Kafka
      ansible.builtin.systemd_service:
        name: kafka
        enabled: true
        state: restarted
        daemon_reload: true

- name: Create research topics
  hosts: kafka[0]
  become: true
  vars:
    kafka_home: "{{ kafka_install_root }}/kafka_{{ kafka_scala_version }}-{{ kafka_version }}"
  tasks:
    - name: Wait for Kafka client port
      ansible.builtin.wait_for:
        host: "{{ private_ip }}"
        port: 9092
        timeout: 120

    - name: Create workload topics
      ansible.builtin.command:
        cmd: >-
          {{ kafka_home }}/bin/kafka-topics.sh
          --bootstrap-server {{ private_ip }}:9092
          --create --if-not-exists
          --topic {{ item }}
          --partitions {{ topic_partitions }}
          --replication-factor {{ topic_replication_factor }}
      loop:
        - workload-wikimedia
        - workload-binance
      register: topic_creation
      changed_when: "'Created topic' in topic_creation.stdout"
